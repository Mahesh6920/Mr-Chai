<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile - Mr Chai</title>

    <link rel="stylesheet" href="../Style/profile.css">
</head>

<body>

    <nav class="navbar">

        <div class="company-name">
            Mr Chai
        </div>

        <div class="nav-links">

            <a href="../index.html">
                Home
            </a>

            <a href="../HTML/login.html" class="logout-btn">
                Logout
            </a>

        </div>

    </nav>


    <main class="profile-container">

        <div class="profile-card">

            <div class="profile-icon-large">👤</div>

            <h2>My Profile</h2>

            <div class="profile-info">

                <p>
                    <strong>ID:</strong>
                    <span><b id="profile-id"></b></span>
                </p>

                <p>
                    <strong>Name:</strong>
                    <span><b id="profile-name"></b></span>
                </p>

                <p>
                    <strong>Email:</strong>
                    <span><b id="profile-email"></b></span>
                </p>

            </div>

            <button class="edit-profile">
                Edit Profile
            </button>

        </div>

    </main>

    <script src="../JS/profile.js"></script>

</body>

</html>
